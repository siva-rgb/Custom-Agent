[pytest]
asyncio_mode = auto
testpaths = tests
# M33 round 2: a gate hung once with no trace; a test past five minutes dumps every thread.
faulthandler_timeout = 300
# M39 (DECISION-31b2c79d): the gates run FakeProvider; tests marked docker run live before review,
# with `pytest -m docker`, which replaces this selection.
markers =
    docker: needs a running Docker daemon and the example image; run live before review
addopts = -m "not docker"
